<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0526">
<title>Yörünge</title>
<style>
  /* Tema belirteçleri — uzay oyunu bilerek yalnız koyu temalı; renkler buradan gelir */
  :root {
    --bg: #0a0526;
    --panel: rgba(14, 20, 54, .94);
    --panel-2: rgba(255, 255, 255, .07);
    --line: rgba(255, 255, 255, .14);
    --text: #f2f5ff;
    --muted: #aab4dc;
    --accent: #5ef2ff;
    --accent-ink: #03222b;
    --gold: #ffd34d;
    --gold-ink: #2b1d00;
    --danger: #ff7096;
    --ok: #4dffa6;
    --violet: #a77bff;
    --pink: #ff5dc8;
    --grad-primary: linear-gradient(135deg, #5ef2ff 0%, #6aa2ff 48%, #b07bff 100%);
    --grad-gold: linear-gradient(135deg, #fff07a 0%, #ffbe2e 50%, #ff7a45 100%);
    --grad-brand: linear-gradient(100deg, #ffffff 0%, #5ef2ff 25%, #b07bff 50%, #ff5dc8 75%, #ffd34d 100%);
    --grad-edge: linear-gradient(135deg, rgba(94, 242, 255, .7), rgba(176, 123, 255, .35) 45%, rgba(255, 93, 200, .6));

    --fs-xs: 12px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px; --fs-2xl: 44px;
    --fs-hero: clamp(44px, 13vw, 68px);
    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --r-md: 14px; --r-lg: 22px;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --dur: 200ms;

    --st: env(safe-area-inset-top, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --banner-h: 0px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: var(--fs-md); line-height: 1.4; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  .ic { width: 22px; height: 22px; flex: none; }
  .gold { color: var(--gold); }
  .muted { color: var(--muted); }

  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------- Düğmeler ---------- */
  .btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    min-height: 52px; padding: 0 var(--s6); border: 0; border-radius: 999px;
    font-size: var(--fs-lg); font-weight: 800; letter-spacing: .02em;
    background: var(--grad-primary); color: #06102a;
    box-shadow: 0 8px 28px rgba(110, 160, 255, .45), inset 0 1px 0 rgba(255, 255, 255, .5);
    transition: transform var(--dur) var(--ease), filter var(--dur) var(--ease), opacity var(--dur); }
  .btn:active { transform: scale(.95); filter: brightness(1.1); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--panel-2); color: var(--text); box-shadow: none; border: 1px solid var(--line); }
  .btn.gold { background: var(--grad-gold); color: var(--gold-ink); box-shadow: 0 8px 28px rgba(255, 160, 60, .45), inset 0 1px 0 rgba(255, 255, 255, .6); }
  /* ışık süzülmesi: birincil ve altın düğmelerde ara ara geçer */
  .btn.xl::after, .btn.gold::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: skewX(-20deg);
    animation: shine 3.2s var(--ease) infinite; pointer-events: none; }
  .btn.sm { min-height: 44px; padding: 0 var(--s5); font-size: var(--fs-md); }
  .btn.xl { min-height: 64px; padding: 0 56px; font-size: var(--fs-xl); }
  .btn.block { width: 100%; }
  .icon-sq { width: 48px; height: 48px; display: grid; place-items: center; border-radius: var(--r-md);
    border: 1px solid var(--line); background: var(--panel-2); transition: transform var(--dur) var(--ease); }
  .icon-sq:active { transform: scale(.92); }
  .pill { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 var(--s3);
    border-radius: 999px; background: rgba(0, 0, 0, .35); border: 1px solid var(--line);
    font-weight: 800; font-size: var(--fs-md); font-variant-numeric: tabular-nums; }
  .pill .ic { width: 18px; height: 18px; }

  /* ---------- Ekranlar ---------- */
  .screen { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    padding: calc(var(--st) + var(--s3)) var(--s4) calc(var(--sb) + var(--banner-h) + var(--s4));
    background: rgba(16, 8, 48, .66); opacity: 0; visibility: hidden; transform: translateY(10px);
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease), visibility 0s linear var(--dur); }
  .screen.on { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
  .screen.center { align-items: center; justify-content: center; }
  #home { background: radial-gradient(ellipse 80% 45% at 50% 34%, rgba(18, 8, 56, .9) 0, rgba(18, 8, 56, .7) 55%, rgba(18, 8, 56, .35) 100%),
                      linear-gradient(180deg, rgba(8, 4, 30, .3), rgba(8, 4, 30, .1) 60%, rgba(8, 4, 30, .85)); }
  #home .orbit { width: min(52vw, 210px); animation: floatY 5s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255, 120, 90, .45)) drop-shadow(0 0 50px rgba(94, 242, 255, .25)); }

  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .orbit { width: min(46vw, 190px); height: auto; filter: drop-shadow(0 0 24px rgba(94, 242, 255, .25)); }
  .orbit .comet { transform-origin: 100px 100px; animation: spin 3.4s linear infinite; }
  .brand { margin: var(--s3) 0 0; font-size: var(--fs-hero); font-weight: 900; letter-spacing: .12em; line-height: 1;
    background: var(--grad-brand); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(176, 123, 255, .45)); animation: shimmer 6s linear infinite; }
  .tagline { margin: var(--s2) 0 0; color: var(--muted); font-size: var(--fs-md); letter-spacing: .04em; }
  .cta { display: flex; flex-direction: column; align-items: center; gap: var(--s3); margin-bottom: var(--s5); }
  .cta .btn { animation: breathe 2.4s var(--ease) infinite; }
  .hint { margin: 0; color: var(--muted); font-size: var(--fs-sm); }
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); width: 100%; max-width: 440px; margin: 0 auto; }
  .dock-btn { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1);
    min-height: 68px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2);
    font-size: var(--fs-xs); font-weight: 700; color: var(--text); transition: transform var(--dur) var(--ease), background var(--dur); }
  .dock-btn:active { transform: scale(.94); background: rgba(255, 255, 255, .12); }
  .dock-btn .ic { width: 26px; height: 26px; color: var(--c); filter: drop-shadow(0 0 8px var(--c)); }
  .dock-btn { --c: var(--accent); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 16%, transparent), rgba(255, 255, 255, .04));
    border-color: color-mix(in srgb, var(--c) 35%, transparent); }
  #navMissions { --c: #4dffa6; } #navShop { --c: #ff5dc8; } #navDaily { --c: #ffd34d; } #navSettings { --c: #5ef2ff; }
  .badge { position: absolute; top: 8px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--danger); color: #fff; font-size: 11px; font-weight: 800; font-style: normal; line-height: 18px; text-align: center;
    box-shadow: 0 0 0 2px var(--bg); animation: pop 240ms var(--ease) both; }

  .bar { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: var(--s3); margin-bottom: var(--s4); }
  .bar h2 { margin: 0; font-size: var(--fs-xl); font-weight: 900; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 calc(-1 * var(--s4)); padding: 0 var(--s4) var(--s4); }

  .card { width: min(100%, 400px); border: 1.5px solid transparent; border-radius: var(--r-lg);
    background: linear-gradient(160deg, rgba(30, 24, 84, .97), rgba(12, 16, 52, .97)) padding-box, var(--grad-edge) border-box;
    padding: var(--s5); text-align: center; box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 0 40px rgba(140, 100, 255, .2); }
  .screen.on .card, .modal .card { animation: cardIn 240ms var(--ease) both; }
  .card h2 { margin: 0 0 var(--s1); font-size: var(--fs-xl); font-weight: 900; }
  .card h3 { margin: 0 0 var(--s2); font-size: var(--fs-lg); font-weight: 800; }
  .card p { margin: 0 0 var(--s4); }
  .stack { display: flex; flex-direction: column; gap: var(--s3); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }

  /* Oyun sonu */
  .big-score { font-size: 80px; font-weight: 900; line-height: 1; margin: var(--s3) 0 var(--s2); font-variant-numeric: tabular-nums;
    background: var(--grad-brand); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 22px rgba(176, 123, 255, .5)); animation: shimmer 6s linear infinite; }
  .stats { display: flex; justify-content: center; gap: var(--s5); margin-bottom: var(--s4); color: var(--muted); font-weight: 700; }
  .stats b { color: var(--text); }
  .new-best { display: inline-block; margin-bottom: var(--s3); padding: var(--s1) var(--s3); border-radius: 999px;
    background: var(--gold); color: var(--gold-ink); font-weight: 900; font-size: var(--fs-sm); letter-spacing: .08em; animation: pop 400ms var(--ease) both; }

  /* Mağaza */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--s3); max-width: 480px; margin: 0 auto; }
  .skin { display: flex; flex-direction: column; align-items: center; gap: var(--s2); padding: var(--s4) var(--s2);
    border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); transition: transform var(--dur) var(--ease), border-color var(--dur); }
  .skin:active { transform: scale(.96); }
  .skin.equipped { border: 1.5px solid transparent; background: linear-gradient(160deg, rgba(40, 30, 100, .9), rgba(16, 20, 60, .9)) padding-box, var(--grad-edge) border-box;
    box-shadow: 0 0 24px rgba(140, 100, 255, .3); }
  .skin .dot { width: 56px; height: 56px; border-radius: 50%; }
  .skin .name { font-weight: 800; }
  .skin .price { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-sm); font-weight: 800; color: var(--gold); }
  .skin .price.dim { color: var(--muted); }
  .skin .price .ic { width: 14px; height: 14px; }

  /* Görevler */
  .list { list-style: none; margin: 0 auto; padding: 0; display: flex; flex-direction: column; gap: var(--s3); max-width: 480px; }
  .mission { display: grid; grid-template-columns: 1fr auto; gap: var(--s2) var(--s3); align-items: center; padding: var(--s4);
    border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); }
  .mission .txt { font-weight: 800; }
  .mission .rw { display: inline-flex; align-items: center; gap: 4px; color: var(--gold); font-weight: 800; font-size: var(--fs-sm); }
  .mission .rw .ic { width: 14px; height: 14px; }
  .bar-p { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
  .bar-p i { display: block; height: 100%; background: linear-gradient(90deg, #5ef2ff, #b07bff 50%, #ff5dc8); border-radius: 4px; transition: width 400ms var(--ease);
    box-shadow: 0 0 10px rgba(176, 123, 255, .6); }
  .mission.done { border-color: rgba(77, 255, 166, .5); }
  .mission.claimed { opacity: .55; }
  .note { text-align: center; margin: 0 0 var(--s4); font-size: var(--fs-sm); }

  /* Sıralama */
  .pill.tap { min-height: 44px; color: inherit; }
  .pill.tap:active { transform: scale(.94); }
  .rank-row { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: var(--s3); min-height: 64px;
    padding: var(--s3) var(--s4); border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel-2); }
  .rank-row .pos { font-weight: 900; font-size: var(--fs-lg); text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rank-row:nth-child(1) .pos { color: var(--gold); }
  .rank-row:nth-child(2) .pos { color: #d8e2ff; }
  .rank-row:nth-child(3) .pos { color: #ff9f6b; }
  .rank-row .who { min-width: 0; }
  .rank-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-row .who small { color: var(--muted); font-size: var(--fs-xs); }
  .rank-row .sc { font-weight: 900; font-size: var(--fs-xl); font-variant-numeric: tabular-nums; }
  .rank-row.me { border-color: rgba(94, 242, 255, .7); box-shadow: 0 0 14px rgba(94, 242, 255, .35); }
  .rank-empty { text-align: center; margin: var(--s6) auto; max-width: 300px; }
  .rank-tabs { display: flex; justify-content: center; margin-bottom: var(--s4); }
  .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button[role="tab"] { min-height: 44px; min-width: 110px; }
  .name-card { max-width: 480px; margin: 0 auto var(--s4); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s2);
    border-radius: var(--r-lg); border: 1px solid rgba(94, 242, 255, .5); background: var(--panel-2); }
  .name-card label { font-weight: 800; }
  .name-row { display: flex; gap: var(--s2); }
  .name-row input { flex: 1; min-width: 0; min-height: 48px; padding: 0 var(--s4); border-radius: var(--r-md); border: 1px solid var(--line);
    background: rgba(0, 0, 0, .35); color: inherit; font: inherit; font-size: 16px; font-weight: 800; }
  .name-card p { margin: 0; font-size: var(--fs-xs); color: var(--muted); }
  .name-card p.bad { color: var(--danger); }
  .rank-me { max-width: 480px; margin: 0 auto var(--s3); display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-weight: 800; }
  .link-btn { min-height: 44px; padding: 0 var(--s2); border: 0; background: none; color: var(--accent); font: inherit; font-weight: 800; }
  .rank-gap { list-style: none; text-align: center; color: var(--muted); font-weight: 900; }

  /* Ayarlar */
  .rows { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s2); }
  .row-item { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 60px; padding: 0 var(--s4);
    border-radius: var(--r-md); background: var(--panel-2); border: 1px solid var(--line); font-weight: 700; }
  .switch { position: relative; width: 56px; height: 34px; border-radius: 17px; border: 0; background: rgba(255, 255, 255, .2); transition: background var(--dur); }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
    transition: transform var(--dur) var(--ease); }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(22px); }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(0, 0, 0, .3); }
  .seg button { min-height: 40px; padding: 0 var(--s4); border: 0; border-radius: 999px; background: none; font-weight: 800; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .danger-link { margin-top: var(--s4); background: none; border: 1px solid rgba(255, 112, 150, .4); color: var(--danger);
    min-height: 52px; border-radius: var(--r-md); font-weight: 800; }
  .ver { text-align: center; color: var(--muted); font-size: var(--fs-xs); margin-top: var(--s4); }

  /* Günlük ödül */
  .days { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s2); margin-bottom: var(--s4); }
  .day { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: var(--s2) 0; border-radius: var(--r-md);
    background: var(--panel-2); border: 1px solid var(--line); font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }
  .day b { color: var(--gold); font-size: var(--fs-md); }
  .day .ic { width: 16px; height: 16px; }
  .day.done { opacity: .5; }
  .day.today { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 18px rgba(255, 211, 77, .3); color: var(--text); animation: breathe 2s var(--ease) infinite; }
  .day.d7 { grid-column: span 2; }

  /* Modal + toast */
  .modal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: var(--s4);
    background: rgba(3, 5, 16, .7); animation: fade 200ms var(--ease) both; }
  #toast { position: fixed; left: 50%; bottom: calc(var(--sb) + var(--banner-h) + 96px); z-index: 80; max-width: 86vw;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: var(--s3) var(--s5); border-radius: 999px;
    background: rgba(14, 20, 54, .96); border: 1px solid var(--line); font-weight: 700; text-align: center;
    transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* HUD */
  #hud { position: fixed; z-index: 10; top: calc(var(--st) + var(--s3)); left: var(--s4); right: var(--s4);
    display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #hudScoreWrap { position: absolute; left: 50%; top: 0; transform: translateX(-50%); text-align: center; pointer-events: none; }
  #hudScore { font-size: var(--fs-2xl); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .6), 0 0 24px rgba(94, 242, 255, .3); }
  #hudScore.bump { animation: bump 240ms var(--ease); }
  #hudCombo { margin-top: var(--s1); font-weight: 900; color: var(--gold); font-size: var(--fs-xl); min-height: 34px;
    text-shadow: 0 0 16px currentColor; }
  #hudCombo.pop { animation: pop 240ms var(--ease); }
  #tut { position: fixed; z-index: 9; left: 0; right: 0; bottom: calc(var(--sb) + 64px); text-align: center; pointer-events: none;
    font-weight: 800; font-size: var(--fs-lg); text-shadow: 0 2px 12px rgba(0, 0, 0, .8); }
  #tut p { margin: var(--s1) var(--s4); }
  #tut .muted { font-size: var(--fs-md); font-weight: 600; }
  .tap-ring { width: 56px; height: 56px; margin: 0 auto var(--s3); border-radius: 50%; border: 3px solid var(--accent); animation: tap 1.2s var(--ease) infinite; }

  .kotiliy-mark { box-sizing: content-box; width: 34px; height: 30px; padding: 7px 12px; border-radius: 10px;
    background: rgba(255, 255, 255, .94) var(--logo-kotiliy) center / contain no-repeat; background-origin: content-box; }
  .credit { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .credit span:not(.kotiliy-mark) { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .4px; color: var(--muted); }
  .about-links { display: flex; justify-content: center; gap: var(--s4); margin-top: var(--s3); font-size: var(--fs-xs); }
  .about-links a { color: var(--muted); text-decoration: underline; padding: var(--s2); }
  #intro .credit { position: absolute; bottom: calc(var(--sb) + var(--s7) + 34px); animation: fadeUp 400ms 2.4s var(--ease) both; }

  /* ---------- Açılış (intro) ---------- */
  #intro { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(7, 11, 31, 0) 0, rgba(7, 11, 31, .55) 70%); transition: opacity 450ms var(--ease); }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro .presents { position: absolute; top: 46%; font-size: var(--fs-lg); font-weight: 900; letter-spacing: .5em; color: var(--text);
    text-shadow: 0 0 24px rgba(94, 242, 255, .6);
    animation: presents 1.5s var(--ease) both; }
  #intro .logo { display: flex; flex-direction: column; align-items: center; animation: logoIn 800ms 1.25s var(--ease) both; }
  /* inline-block harfler üst öğenin background-clip:text'ini almaz -> degrade her harfte */
  #intro .brand { animation: none; }
  #intro .brand span { display: inline-block; background: var(--grad-brand); background-size: 700% 100%; background-position: calc(var(--i) * 16.66%) 0;
    -webkit-background-clip: text; background-clip: text; animation: letterIn 520ms var(--ease) both; animation-delay: calc(1.5s + var(--i) * 70ms); }
  #intro .tagline { animation: fadeUp 500ms 2.25s var(--ease) both; }
  #intro .skip { position: absolute; bottom: calc(var(--sb) + var(--s7)); color: var(--muted); font-size: var(--fs-sm); font-weight: 700;
    letter-spacing: .1em; animation: fadeUp 400ms 2.7s var(--ease) both, blink 1.6s 3.1s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  /* Sektör / kontrol noktası bandı */
  #sectorBanner { position: fixed; z-index: 12; left: 0; right: 0; top: 24%; display: flex; flex-direction: column; align-items: center;
    gap: var(--s1); pointer-events: none; text-align: center; }

  .sp-label b { font-size: var(--fs-md); font-weight: 900; color: var(--gold); }

  .confetti { position: absolute; top: -16px; width: 9px; height: 15px; border-radius: 2px; pointer-events: none;
    animation: confetti 2s cubic-bezier(.3, .6, .5, 1) both; }
  @keyframes confetti { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .6; } }

  function addPlanet() {
    var n = world.n++, prev = world.planets[world.planets.length - 1];
    var sd = sectorDef(sectorOf(n)), cp = n > 0 && n % SECTOR_LEN === 0;
    var p = { n: n, x: W / 2, y: 0, r: 30, R: 0, x0: 0, ws: 0, moon: null, drift: null, visited: !prev, pulse: 0,

    (function step(now) {

    run.continued = true;
    rescue();
    phase = "idle";
    startPlay();
  }

  // Oyun sonundan çıkış. Geçiş reklamı gösterilirse oyun reklam kapanınca başlar.
  function leaveOver(toMenu) {
    freshWorld();
    phase = "idle";
    showScreen(toMenu ? "home" : null);
    if (toMenu) { Ads.maybeInterstitial(noop); return; }
    if (!Ads.maybeInterstitial(startPlay)) startPlay();
  }

  function pauseGame() {
    if (phase !== "play") return;
    phase = "paused"; Sound.stopMusic();
    showScreen("pause");
  }
  function resumeGame() {
    if (phase !== "paused") return;
    phase = "play"; Sound.startMusic();
    showScreen(null);
  }

  /* 12) GİRDİ ------------------------------------------------------------ */
  cv.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (intro.on) return;
    if (phase === "idle" && screenNow === null) startPlay();   // reklam olayı gelmezse yedek: dokununca başla
    else launch();
  });
  window.addEventListener("keydown", function (e) {
    if (intro.on) { if (e.key === " " || e.key === "Enter" || e.key === "Escape") endIntro(); return; }
    if (e.key === " " && screenNow === null) { e.preventDefault(); if (phase === "idle") startPlay(); else launch(); }
    if (e.key === "Escape") handleBack();
  });
  function bind(id, fn) { $(id).addEventListener("click", function (e) { Sound.ensure(); Sound.click(); fn(e); }); }

  bind("btnPlay", startPlay);
  bind("btnPause", pauseGame);
  bind("btnResume", resumeGame);
  bind("btnRestart", function () { freshWorld(); phase = "idle"; startPlay(); });
  bind("btnPauseMenu", function () { freshWorld(); phase = "idle"; showScreen("home"); Sound.startMusic(); });
  bind("spPrev", function () { pickSector(-1); });
  bind("spNext", function () { pickSector(1); });
  bind("btnCheckpoint", function () { if (run.cpUsed) Ads.rewarded(restartFromCheckpoint); else restartFromCheckpoint(); });
  bind("navShop", function () { showScreen("shop"); });
  bind("navMissions", function () { showScreen("missions"); });
  bind("navRank", function () { showScreen("rank"); });
  var rtabs = document.querySelectorAll("[data-rtab]");
  for (var rt = 0; rt < rtabs.length; rt++) rtabs[rt].addEventListener("click", function () {
    Sound.click(); rankTab = this.getAttribute("data-rtab"); renderRank();
  });
  bind("btnRename", function () { showNameCard(Online.name()); $("nameInput").focus(); });
  bind("btnWorldRetry", renderWorld);
  $("nameCard").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("nameInput").value.replace(/\s+/g, " ").trim(), btn = $("btnName");
    if (!NAME_RE.test(v)) { nameMsg("rank.nameBad", true); return; }
    btn.disabled = true; nameMsg("rank.saving", false);
    Online.submit(v).then(function (r) {
      btn.disabled = false;
      var err = r && r.err;
      if (r && r.ok) { $("nameInput").blur(); Haptic.success(); renderWorld(); }
      else nameMsg(err === "taken" ? "rank.nameTaken" : err === "name" ? "rank.nameBad" : err === "rate" ? "rank.rate" : "rank.error", true);
    }, function () { btn.disabled = false; nameMsg("rank.offline", true); });
  });
  bind("navSettings", function () { showScreen("settings"); });
  bind("navDaily", openDaily);
  var backs = document.querySelectorAll("[data-back]");
  for (var b0 = 0; b0 < backs.length; b0++) backs[b0].addEventListener("click", function () { Sound.click(); showScreen("home"); });

  bind("btnContinue", function () { Ads.rewarded(continueRun); });
  bind("btnDouble", function () {
    Ads.rewarded(function () {
      if (run.doubled) return;
      run.doubled = true; addCoins(run.coins); Missions.add("stars", run.coins);
      showToast(t("toast.reward", { n: run.coins })); Sound.fanfare();
      $("btnDouble").hidden = true; $("overCoins").textContent = "+" + run.coins * 2;
    });
  });
  bind("btnRetry", function () { leaveOver(false); });
  bind("btnOverMenu", function () { leaveOver(true); });

  bind("btnDailyClaim", function () { Daily.claim(1); closeDaily(); });
  bind("btnDailyDouble", function () { Ads.rewarded(function () { Daily.claim(2); closeDaily(); }); });
  bind("btnDailyClose", closeDaily);

  $("cfNo").addEventListener("click", closeConfirm);
  $("cfYes").addEventListener("click", function () { var f = _cfYes; closeConfirm(); if (f) f(); });

  function toggle(id, get, set) { bind(id, function () { set(!get()); renderSettings(); }); }
  toggle("swSfx", function () { return Sound.sfx; }, function (v) { Sound.sfx = v; Store.set("sfx", v); });
  toggle("swMusic", function () { return Sound.music; }, function (v) { Sound.music = v; Store.set("music", v); if (v) Sound.startMusic(); else Sound.stopMusic(); });
  toggle("swVibe", function () { return Haptic.on; }, function (v) { Haptic.on = v; Store.set("vibe", v); if (v) Haptic.medium(); });
  toggle("swNotify", function () { return Notify.on; }, function (v) { Notify.on = v; Store.set("notify", v); Notify.plan(); });
  var langs = document.querySelectorAll("[data-lang]");
  for (var l0 = 0; l0 < langs.length; l0++) langs[l0].addEventListener("click", function () {
    LANG = this.getAttribute("data-lang"); Store.set("lang", LANG);
    applyI18n(); renderSettings(); Notify.plan();
  });
  bind("btnReset", function () {
    askConfirm({ title: t("settings.resetQ"), text: t("settings.resetText"), yes: t("common.reset") }, function () {
      Store.wipe(); location.reload();
    });
  });

  // Android geri tuşu / Escape: bir üst katman
  function handleBack() {
    if (!$("confirm").hidden) return closeConfirm();
    if (!$("daily").hidden) return closeDaily();
    if (screenNow === "shop" || screenNow === "missions" || screenNow === "settings") return showScreen("home");
    if (screenNow === "pause") return resumeGame();
    if (screenNow === "over") return leaveOver(true);
    if (screenNow === null && phase === "play") return pauseGame();
    if (screenNow === "home") {
      var ap = capPlugin("App");
      if (ap) { if (ap.minimizeApp) ap.minimizeApp(); else if (ap.exitApp) ap.exitApp(); }
    }
  }

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { pauseGame(); Sound.stopMusic(); }
    else if (phase !== "paused" && !intro.on) Sound.startMusic();
  });
  window.addEventListener("resize", layout);

  /* Açılış: ışık hızı (tuval) + logo / harf animasyonu (CSS). Dokununca atlanır. */
  function endIntro() {
    if (!intro.on) return;
    intro.on = false;
    var el = $("intro");
    el.classList.add("out");
    setTimeout(function () { el.hidden = true; }, 460);
    showScreen("home");
    Sound.ensure(); Sound.startMusic();
    if (Daily.claimable()) setTimeout(openDaily, reduceMotion ? 0 : 500);
  }
  $("intro").addEventListener("pointerdown", function (e) { e.preventDefault(); endIntro(); });

  /* 13) NATIVE (yalnız uygulama olarak paketlenince) ---------------------- */
  (function initNative() {
    if (!window.Capacitor) return;
    try { var sp = capPlugin("SplashScreen"); if (sp && sp.hide) sp.hide(); } catch (e) {}
    try {
      var sb = capPlugin("StatusBar");
      if (sb) {
        if (sb.setStyle) sb.setStyle({ style: "DARK" });
        if (sb.setBackgroundColor) sb.setBackgroundColor({ color: "#0a0526" });
      }
    } catch (e) {}
    try {
      var ap = capPlugin("App");
      if (ap && ap.addListener) {
        ap.addListener("backButton", handleBack);
        ap.addListener("pause", function () { pauseGame(); Sound.stopMusic(); });
        ap.addListener("resume", function () { Notify.plan(); if (phase !== "paused") Sound.startMusic(); });
      }
    } catch (e) {}
    try { Ads.init(); } catch (e) {}
    try { if (Store.get("notify.asked", false)) Notify.plan(); } catch (e) {}
  })();

  /* 14) BAŞLAT ----------------------------------------------------------- */
  layout();
  applyI18n();
  Missions.load();
  freshWorld();
  addCoins(0);
  setTimeout(endIntro, intro.dur * 1000);

  var last = 0;
  function frame(ts) {
    var dt = Math.min((ts - last) / 1000 || 0, 1 / 30);
    last = ts;
    if (intro.on) intro.t += dt; else intro.after += dt;
    if (phase !== "paused") update(dt);
    render(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Test botu / hata ayıklama için oyun durumu (yalnız yorunge.html#debug)
  if (location.hash === "#debug") window.__y = function () { return { player: player, world: world, phase: phase, run: run, FLY: FLY, Sound: Sound, MOODS: MOODS, ONLINE_CFG: ONLINE_CFG, Online: Online }; };

  /* 15) ÖZ-SINAMA — yorunge.html#selftest ile açınca konsola sonuç yazar ---- */
  if (location.hash === "#selftest") {
    var fails = [];
    var ok = function (c, m) { if (!c) fails.push(m); };
    // teğet fırlatma: a=0, dir=+1 -> +y yönünde
    phase = "play"; player.a = 0; player.dir = 1; player.ot = 0;
    launch();
    ok(Math.abs(player.vx) < 1e-9 && Math.abs(player.vy - FLY) < 1e-9, "fırlatma teğet değil");
    // yakalama yönü: sağ kenardan +y'ye giden -> açı artar (+1)
    var q = world.planets[1];
    player.vx = 0; player.vy = FLY; capture(q, q.R, 0);
    // anında atlandı -> "hızlı" -> kombo x2, puan 2
    ok(player.dir === 1 && player.p === q && run.combo === 2 && run.score === 2, "yakalama yönü/kombo puanı hatalı");
    player.vx = 0; player.vy = -FLY; player.st = "fly"; capture(q, q.R, 0);
    ok(player.dir === -1 && run.score === 2, "ters yakalama yönü ya da ziyaret edilmiş gezegene tekrar puan");
    // görevler: aynı gün aynı, 3 farklı tür
    var a1 = genMissions("2026-1-1"), a2 = genMissions("2026-1-1");
    ok(JSON.stringify(a1) === JSON.stringify(a2), "görevler deterministik değil");
    ok(a1[0].type !== a1[1].type && a1[1].type !== a1[2].type && a1[0].type !== a1[2].type, "görev türleri tekrar ediyor");
    // yörünge çökmesi: 2 tur güvenli, 3. tur sonunda 1
    var tq = { ws: Math.PI };   // 1 tur = 2 sn
    ok(Sound._moodFor(-1) === MOOD_MENU && Sound._moodFor(2) === MOODS[2] && Sound._moodFor(7).root !== MOODS[1].root && Sound._moodFor(7) === Sound._moodFor(7), "müzik ruh hali seçimi hatalı");
    ok(MOODS.concat([MOOD_MENU]).every(function (m) { return m.arp.length === 16 && m.scale.length === 5; }), "müzik deseni 16 adım / 5 derece olmalı");
    var keepScores = Store.get("scores", []);
    Store.set("scores", []);
    for (var ri = 1; ri <= 12; ri++) Ranks.add({ id: ri, s: ri * 10, sec: 0, c: 1 });
    ok(Ranks.list().length === 10 && Ranks.list()[0].s === 120 && Ranks.add({ id: 99, s: 5, sec: 0, c: 1 }) === 0, "sıralama ilk 10 olmalı");
    ok(Ranks.add({ id: 12, s: 50, sec: 0, c: 1 }) === 1 && Ranks.list()[0].s === 120, "aynı oyunun düşük puanı rekoru silmemeli");
    ok(Ranks.add({ id: 3, s: 115, sec: 1, c: 2 }) === 2 && Ranks.list().filter(function (e) { return e.id === 3; }).length === 1, "aynı oyun tek satır olmalı");
    Store.set("scores", keepScores);
    ok(orbitWarn(tq, 3.9) === 0 && orbitWarn(tq, 5) === 0.5 && orbitWarn(tq, 7) === 1, "yörünge çökme zamanlaması hatalı");
    // günlük seri
    ok(nextStreak("", 0, "d2", "d1") === 1, "ilk gün 1 değil");
    ok(nextStreak("d1", 3, "d2", "d1") === 4, "seri artmıyor");
    ok(nextStreak("d1", 7, "d2", "d1") === 1, "7. günden sonra başa dönmüyor");
    ok(nextStreak("d0", 5, "d2", "d1") === 1, "kaçırılan gün seriyi sıfırlamıyor");
    ok(nextStreak("d2", 5, "d2", "d1") === 5, "bugün alınmışken seri değişti");
    // sektör / kontrol noktası
    ok(sectorOf(19) === 0 && sectorOf(20) === 1 && sectorOf(45) === 2, "sektör hesabı hatalı");
    ok(sectorDef(9) === sectorDef(9) && sectorDef(9).id === "deep", "derin uzay sektörü tutarsız");
    newWorld(40);
    ok(world.planets[0].n === 40 && run.cp && run.cp.n === 40 && run.sector === 2 && world.planets[0].visited, "kontrol noktasından başlama hatalı");
    ok(world.planets.some(function (p) { return p.n === 60 && p.cp; }) || world.planets[world.planets.length - 1].n < 60, "kontrol noktası işareti yok");
    // kalkan: ölümü bir kez önler
    phase = "play"; run.shield = true; die("moon");
    ok(phase === "play" && !run.shield && player.st === "orbit", "kalkan ölümü önlemedi");
    die("moon");
    ok(phase === "dead", "kalkansız ölüm olmadı");
    newWorld(); phase = "idle";
    console.log(fails.length ? "SELFTEST FAIL: " + fails.join("; ") : "SELFTEST OK");
    document.title = fails.length ? "FAIL" : "OK";
  }
})();
</script>
</body>
</html>
