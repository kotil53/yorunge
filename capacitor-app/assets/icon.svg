<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Önemli öğeler merkezdeki ~%66'lık güvenli alanda: Android uyarlanabilir ikonu kenarları kırpar -->
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#3a1f9a"/>
      <stop offset="0.55" stop-color="#1a0c52"/>
      <stop offset="1" stop-color="#0a0526"/>
    </radialGradient>
    <radialGradient id="nebPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5dc8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5dc8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#28c8ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#28c8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ff6a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pl" cx="0.33" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe9c4"/>
      <stop offset="0.5" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#a1124f"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.3" cy="0.27" r="0.3">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ef2ff"/>
      <stop offset="0.5" stop-color="#b07bff"/>
      <stop offset="1" stop-color="#ff5dc8"/>
    </linearGradient>
    <linearGradient id="ringG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd34d"/>
      <stop offset="1" stop-color="#ffe9c4"/>
    </linearGradient>
    <linearGradient id="tail" gradientUnits="userSpaceOnUse" x1="340" y1="274" x2="705" y2="290">
      <stop offset="0" stop-color="#5ef2ff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#8ff6ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#e9feff"/>
    </linearGradient>
    <radialGradient id="cometGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#8ff6ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#5ef2ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="front" clipPathUnits="userSpaceOnUse"><rect x="0" y="540" width="1024" height="600"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="230" cy="250" r="420" fill="url(#nebPink)"/>
  <circle cx="830" cy="820" r="420" fill="url(#nebCyan)"/>

  <g fill="#fff">
    <circle cx="150" cy="170" r="5" opacity=".9"/><circle cx="880" cy="150" r="6" fill="#fff1b8"/><circle cx="840" cy="880" r="5" fill="#ffd6f5"/>
    <circle cx="170" cy="840" r="4" fill="#bfeaff"/><circle cx="890" cy="470" r="3"/><circle cx="110" cy="520" r="3" fill="#ffd6f5"/>
    <circle cx="620" cy="110" r="3"/><circle cx="410" cy="920" r="3" fill="#fff1b8"/>
  </g>

  <!-- yörünge -->
  <circle cx="512" cy="520" r="300" fill="none" stroke="url(#orbit)" stroke-opacity="0.25" stroke-width="22"/>
  <circle cx="512" cy="520" r="300" fill="none" stroke="url(#orbit)" stroke-width="8" stroke-dasharray="24 20" stroke-linecap="round"/>

  <!-- gezegen -->
  <circle cx="512" cy="540" r="250" fill="url(#halo)"/>
  <g transform="rotate(-18 512 540)">
    <ellipse cx="512" cy="540" rx="262" ry="56" fill="none" stroke="url(#ringG)" stroke-opacity="0.55" stroke-width="20"/>
  </g>
  <circle cx="512" cy="540" r="180" fill="url(#pl)"/>
  <g opacity="0.18" fill="#a1124f">
    <circle cx="450" cy="600" r="26"/><circle cx="575" cy="470" r="18"/><circle cx="590" cy="620" r="14"/>
  </g>
  <circle cx="512" cy="540" r="180" fill="url(#spec)"/>
  <path d="M352 470 A172 172 0 0 1 560 374" fill="none" stroke="#ffe9c4" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round"/>
  <g transform="rotate(-18 512 540)" clip-path="url(#front)">
    <ellipse cx="512" cy="540" rx="262" ry="56" fill="none" stroke="url(#ringG)" stroke-width="20"/>
  </g>

  <!-- kuyruklu yıldız: yörünge yayı boyunca iz -->
  <path d="M340 274 A300 300 0 0 1 705 290" fill="none" stroke="url(#tail)" stroke-width="30" stroke-linecap="round"/>
  <circle cx="705" cy="290" r="88" fill="url(#cometGlow)"/>
  <circle cx="705" cy="290" r="30" fill="#ffffff"/>
</svg>
